<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 03: Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Color Swatch Palette</h1>

    <div class="palette">
        <div class="swatch named">Named</div>
        <div class="swatch hex">HEX</div>
        <div class="swatch rgb">RGB</div>
        <div class="swatch rgba">RGBA</div>
    </div>

    <h1>Opacity vs RGBA</h1>

    <div class="comparison">
        <div class="box opacity-box">
            <p>Opacity 0.5</p>
            <div class="child">Child</div>
        </div>

        <div class="box rgba-box">
            <p>RGBA 0.5</p>
            <div class="child">Child</div>
        </div>
    </div>

</body>
</html>
